- name: Install and configure packages
  hosts: all
  become: yes
  tasks:
    - name: Install git package
      package:
        name: git
        state: present

    - name: Install httpd package
      package:
        name: httpd
        state: present

    - name: Start httpd service
      service:
        name: httpd
        state: started

    - name: Enable httpd service
      service:
        name: httpd
        enabled: yes


